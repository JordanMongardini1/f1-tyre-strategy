[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["f1strategy"]

[project]
name = "f1strategy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastf1",
    "pandas",
    "numpy",
    "torch",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["jupyter", "pytest"]