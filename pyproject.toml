[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["f1strategy"]

[project]
name = "f1strategy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastf1~=3.8.3",
    "pandas~=2.3.3",
    "numpy~=2.5.2",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["jupyter"]